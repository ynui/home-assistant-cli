name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commits, not tags: a tag can be moved after the fact, and this
      # is the gate for what lands. The majors track the runner's Node: node20
      # is only being force-run on node24 and is going away.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Same gate `make fmt` applies, without rewriting anything: a diff that
      # gofmt would have changed should fail here, not land.
      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # -cover so the number is in the log: the read commands' tables were
      # untested for a long time and nobody noticed, because nothing printed
      # the coverage.
      - name: go test
        run: go test -race -cover ./...

      - name: make build
        run: make build
