name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Same gate `make fmt` applies, without rewriting anything: a diff that
      # gofmt would have changed should fail here, not land.
      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go test -race ./...

      - run: make build