name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: darwin-arm64, os: macos-latest, goos: darwin, goarch: arm64 }
          - { name: darwin-amd64, os: macos-latest, goos: darwin, goarch: amd64 }
          - { name: linux-amd64, os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { name: linux-arm64, os: ubuntu-latest, goos: linux, goarch: arm64 }
          - { name: windows-amd64, os: ubuntu-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commits, not tags: this workflow publishes the release
      # binaries, and a tag can be moved after the fact. The majors track the
      # runner's Node: node20 is only being force-run on node24 and is going
      # away.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          # Plain name inside the archive: the version belongs to the archive,
          # not to the binary, or `bin.install "home-assistant-cli"` in the brew
          # formula has nothing to install.
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "home-assistant-cli$EXT" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bin-${{ matrix.name }}
          # ${{ env.VERSION }}, not $VERSION: an input is not a shell, and a
          # literal $VERSION globs nothing and uploads nothing.
          path: home-assistant-cli*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist

      - name: Package
        run: |
          for dir in dist/bin-*/; do
            arch=${dir#dist/bin-}; arch=${arch%/}
            file=$(ls "$dir")
            if [[ $file == *.exe ]]; then
              zip -q "home-assistant-cli-$VERSION-$arch.zip" -j "$dir/$file"
            else
              tar -czf "home-assistant-cli-$VERSION-$arch.tar.gz" -C "$dir" "$file"
            fi
          done
          # The shell expands the glob before the redirect creates the output,
          # so the checksums file does not list itself. Named with the release
          # prefix so the same glob below uploads it with the archives.
          sha256sum home-assistant-cli-$VERSION-* > "home-assistant-cli-$VERSION-checksums.txt"
          cat home-assistant-cli-$VERSION-checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: home-assistant-cli-${{ env.VERSION }}-*

      # Four archives means four urls and four checksums, which is past what a
      # sed expression should be trusted with; the shape of the formula stays the
      # one in the tap, only the version, urls and shas move.
      - name: Bump Homebrew tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN not set; skipping tap bump"; exit 0; fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/ynui/homebrew-tap.git" tap
          cd tap
          python3 - "$VERSION" <<'PY'
          import hashlib, pathlib, re, sys
          ver = sys.argv[1].removeprefix("v")
          base = "https://github.com/ynui/home-assistant-cli/releases/download"
          # ".." is the workspace: the package step writes the archives beside
          # dist/, not inside it, and dist/ holds only the raw binaries.
          shas = {}
          for f in pathlib.Path("..").glob("home-assistant-cli-*.tar.gz"):
              m = re.fullmatch(r"home-assistant-cli-v[\d.]+-(darwin|linux)-(arm64|amd64)\.tar\.gz", f.name)
              shas[f"{m[1]}-{m[2]}"] = hashlib.sha256(f.read_bytes()).hexdigest()
          path = pathlib.Path("Formula/home-assistant-cli.rb")
          arch, out = None, []
          for line in path.read_text().splitlines():
              if ".tar.gz" in line:
                  arch = re.search(r"(darwin|linux)-(arm64|amd64)\.tar\.gz", line).group(0)[:-7]
                  pad = line[: len(line) - len(line.lstrip())]
                  line = f'{pad}url "{base}/v{ver}/home-assistant-cli-v{ver}-{arch}.tar.gz"'
              elif line.strip().startswith("sha256"):
                  pad = line[: len(line) - len(line.lstrip())]
                  line = f'{pad}sha256 "{shas[arch]}"'
              elif line.startswith("  version"):
                  line = f'  version "{ver}"'
              out.append(line)
          path.write_text("\n".join(out) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "home-assistant-cli $VERSION"
            git push
          else
            echo "Tap formula already up to date"
          fi